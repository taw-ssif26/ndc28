services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {POSTGRES_DB: ndc, POSTGRES_USER: ndc, POSTGRES_PASSWORD: "${DB_PASSWORD}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ndc -d ndc"], interval: 5s, retries: 12}
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: {DATABASE_URL: "postgresql://ndc:${DB_PASSWORD}@db:5432/ndc", PROD: "1"}
    depends_on: {db: {condition: service_healthy}}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data"]
    depends_on: [app]
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment: {POSTGRES_HOST: db, POSTGRES_DB: ndc, POSTGRES_USER: ndc, POSTGRES_PASSWORD: "${DB_PASSWORD}", SCHEDULE: "@daily", BACKUP_KEEP_DAYS: 7, BACKUP_KEEP_WEEKS: 4, BACKUP_KEEP_MONTHS: 6}
    volumes: ["./backups:/backups"]
    depends_on: [db]
volumes: {pgdata: {}, caddy: {}}
